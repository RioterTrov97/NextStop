<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="description" content="NextStop: live Sydney train, metro, bus, ferry and light rail trips." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Opaque bar filled with theme-color: since iOS 26, black-translucent makes iOS draw a Liquid Glass blur over the top of the app. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NextStop" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // Apply the saved/system colour mode before first paint so dark mode doesn't flash white.
      try {
        var t = localStorage.getItem('theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <style>
      html {
        background: #fff;
      }
      html.dark {
        background: #09090b;
      }
      /*
        Installed iPhone app only. iOS 27 draws a blur and dark gradient under the status bar unless an opaque element
        is painted there from the first frame; a header rendered later by React is too late. This strip covers the
        status bar in the header colour (invisible against it), lets taps through, and dims with sheets.
      */
      #ns-status-strip {
        display: none;
      }
      @media (display-mode: standalone) {
        #ns-status-strip {
          display: block;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: max(11px, env(safe-area-inset-top));
          background: %THEME_COLOR%;
          z-index: 2147483646;
          pointer-events: none;
          transition: background-color 0.3s ease-out;
        }
        html[data-overlay] #ns-status-strip {
          background: var(--ns-header-dim);
        }
      }
    </style>
    <title>NextStop</title>
  </head>
  <body>
    <div id="ns-status-strip" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
